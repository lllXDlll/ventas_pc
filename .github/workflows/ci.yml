# Integración continua (spec entrega-continua, design.md D10).
# Job "verificar": en cada push y pull request.
# Job "desplegar" (tarea 6.3): solo en main, después de "verificar".
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela una ejecución en curso: podría cortar un despliegue a medias.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xdtech
          POSTGRES_PASSWORD: xdtech
          POSTGRES_DB: xdtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdtech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales del Postgres efímero de la CI (no son secretos).
      DIRECT_URL: postgresql://xdtech:xdtech@localhost:5432/xdtech
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # usa la versión de "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos de la API
        run: pnpm --filter api typecheck

      - name: Tipos del frontend
        run: pnpm --filter web typecheck

      # El reporter github-actions publica cada falla como anotación del job.
      - name: Pruebas unitarias y e2e en workerd
        run: pnpm --filter api test --reporter=default --reporter=github-actions

      - name: Migraciones en el Postgres de la CI
        run: pnpm --filter api migrate:deploy

      - name: Pruebas de integración (Postgres y Worker empaquetado)
        run: pnpm --filter api test:int --reporter=default --reporter=github-actions

      - name: Build de la API (bundle de Wrangler)
        run: pnpm --filter api build

      - name: Build del frontend (OpenNext)
        run: pnpm --filter web build:cf

  # Pruebas e2e de navegador con Playwright (design D14 del Sprint 1): API con wrangler dev
  # y frontend con next build + start, contra el Postgres efímero del job.
  e2e:
    # Fijo: playwright install --with-deps solo conoce versiones concretas de Ubuntu, y
    # ubuntu-latest está migrando a Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xdtech
          POSTGRES_PASSWORD: xdtech
          POSTGRES_DB: xdtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xdtech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera de la CI y un administrador que solo existe en ella (no son secretos).
      DIRECT_URL: postgresql://xdtech:xdtech@localhost:5432/xdtech
      E2E_ADMIN_CORREO: admin-e2e@xdtech.test
      E2E_ADMIN_CONTRASENA: clave-admin-e2e-ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Migraciones en el Postgres de la CI
        run: pnpm --filter api migrate:deploy

      - name: Pruebas e2e (Playwright)
        run: pnpm test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Tarea 6.3: solo en push a main, después de "verificar" y "e2e". Nunca en PR ni en otras ramas.
  desplegar:
    needs: [verificar, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Comprobar secretos
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          faltan=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_DIRECT_URL; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v"; faltan=1; fi
          done
          exit $faltan

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Primero el esquema: el código nuevo puede depender de él.
      # Con reintentos: si Neon está suspendida, la primera conexión puede fallar
      # mientras despierta. migrate deploy es idempotente.
      - name: Migraciones en Neon
        run: |
          for intento in 1 2 3; do
            pnpm --filter api migrate:deploy && exit 0
            echo "::warning::migrate deploy falló (intento $intento de 3); reintento en 15 s"
            sleep 15
          done
          exit 1
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

      # Idempotente: las ocho categorías del catálogo (design D11 del Sprint 1).
      - name: Semilla de categorías
        run: pnpm --filter api semilla:categorias
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

      # "run deploy": "pnpm deploy" a secas es un comando propio de pnpm.
      - name: Desplegar la API
        run: pnpm --filter api run deploy

      - name: Desplegar el frontend
        run: pnpm --filter web run deploy
        env:
          NEXT_PUBLIC_API_URL: https://api.xdtech.store

      - name: Prueba de humo
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.xdtech.store/health/live; then echo; exit 0; fi
            echo "Intento $i sin respuesta; reintento en 10 s"; sleep 10
          done
          echo "::warning::api.xdtech.store aún no responde (el certificado del Custom Domain puede tardar unos minutos)"
